# MySQL 8.4 para desarrollo y pruebas (alternativa a instalar MySQL localmente).
# Uso: docker compose up -d
# Si ya tienes MySQL en el puerto 3306, define MYSQL_PORT=3307 y ajusta las URLs de .env.
services:
  mysql:
    image: mysql:8.4
    container_name: canchaya-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: canchaya
      MYSQL_USER: canchaya
      MYSQL_PASSWORD: canchaya
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - canchaya-mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  canchaya-mysql-data:
