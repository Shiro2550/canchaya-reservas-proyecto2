# CanchaYa con Docker (ver README, sección «Cómo ejecutar»).
#
#   Todo en contenedores (MySQL + app):   docker compose up -d --build   → http://localhost:8080
#   Solo la base de datos (desarrollo):   docker compose up -d mysql     → luego npm run dev
#
# Puertos configurables con variables de entorno o en un archivo .env:
#   APP_PORT   (por defecto 8080) puerto de la app en tu máquina
#   MYSQL_PORT (por defecto 3306) puerto de MySQL en tu máquina; usa 3307 si ya tienes MySQL instalado
services:
  mysql:
    image: mysql:8.4
    container_name: canchaya-mysql
    restart: unless-stopped
    # Socket con nombre propio: el motor de migraciones de Prisma, tras conectar por TCP a 127.0.0.1,
    # intenta pasarse al socket que informa el servidor. Con el nombre por defecto
    # (/var/run/mysqld/mysqld.sock) terminaría en un MySQL instalado en tu máquina, si lo tienes.
    command: ["mysqld", "--socket=/var/run/mysqld/canchaya-docker.sock"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: canchaya
      MYSQL_USER: canchaya
      MYSQL_PASSWORD: canchaya
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - canchaya-mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    image: canchaya-app:latest
    container_name: canchaya-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://canchaya:canchaya@mysql:3306/canchaya
      LOG_LEVEL: info
      SEED_ON_START: "true"
    ports:
      - "${APP_PORT:-8080}:3000"

volumes:
  canchaya-mysql-data:
